<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#05070d" />
    <title>パチトラッカー 自動解析</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #05070d;
        color: #eef4ff;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #05070d;
      }
      main {
        width: min(420px, calc(100vw - 40px));
        padding: 24px;
        border: 1px solid #263248;
        border-radius: 16px;
        background: #0d1420;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 20px;
      }
      #worker-status {
        margin: 0;
        color: #72b7ff;
        font-weight: 700;
      }
      #worker-detail {
        margin: 10px 0 0;
        color: #9ca9ba;
        font-size: 13px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body data-worker-phase="starting">
    <main>
      <h1>自動解析ワーカー</h1>
      <p id="worker-status" role="status" aria-live="polite">起動しています</p>
      <p id="worker-detail">localhostとの接続を確認しています。</p>
    </main>
    <script type="module" src="./src/autoWorker.jsx"></script>
  </body>
</html>
